name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: API, Mac agent, shared packages
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codebridge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/codebridge_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  agent-windows:
    name: Agent on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @codebridge/protocol --filter @codebridge/shared build
      - run: pnpm --filter codebridge-agent typecheck
      - run: pnpm --filter codebridge-agent test
      - name: Pack and run the published artifact
        shell: bash
        run: |
          pnpm --filter codebridge-agent bundle
          mkdir "$RUNNER_TEMP/pack" "$RUNNER_TEMP/clean"
          (cd apps/mac-agent && npm pack --pack-destination "$RUNNER_TEMP/pack")
          cd "$RUNNER_TEMP/clean" && npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/pack/codebridge-agent-*.tgz
          CODEBRIDGE_HOME="$RUNNER_TEMP/home" npx codebridge-agent status

  android:
    name: Android (Kotlin core + Compose app)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codebridge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Start the API for the client contract test
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --filter @codebridge/api build
          cd apps/api
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/codebridge PORT=8080 LOG_LEVEL=warn \
            CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32) node dist/src/server.js &
          for i in $(seq 60); do curl -sf localhost:8080/readyz && break; sleep 1; done
      - name: Kotlin core tests (incl. contract test against the running API)
        working-directory: apps/android
        env:
          CODEBRIDGE_IT_API_URL: http://localhost:8080
        run: ./gradlew :core:test --stacktrace
      - name: Build the Android app
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --stacktrace

  ios:
    name: iOS (CodeBridgeKit + SwiftUI app)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: CodeBridgeKit tests
        run: swift test --package-path apps/ios/CodeBridgeKit
      - name: Build the app for the iOS Simulator
        run: |
          xcodebuild -project apps/ios/CodeBridge.xcodeproj -scheme CodeBridge \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -200
          exit ${PIPESTATUS[0]}
