name: Relay image

# Publishes the personal relay image that `codebridge-relay fly` deploys.
# After the first run, make the package public: GitHub → Packages → codebridge-relay → Package settings.
on:
  push:
    branches: [main]
    paths:
      [
        'apps/api/**',
        'packages/**',
        'infra/relay*',
        'pnpm-lock.yaml',
        '.github/workflows/relay-image.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/relay.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/codebridge-relay:latest
            ghcr.io/${{ github.repository_owner }}/codebridge-relay:${{ github.sha }}
