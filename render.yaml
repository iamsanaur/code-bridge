# Render Blueprint: a personal CodeBridge relay on your own Render account.
# A persistent disk needs a paid instance; on a free instance the data is wiped on every restart
# and the service sleeps, which drops your phone's connection.
services:
  - type: web
    name: codebridge-relay
    runtime: docker
    dockerfilePath: ./infra/relay.Dockerfile
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: relay-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: OWNER_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: 'true'
